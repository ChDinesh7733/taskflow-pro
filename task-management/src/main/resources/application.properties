# ============================================================
# Task Management System — Application Configuration
# ============================================================
# IMPORTANT: Do NOT commit database credentials to source control.
# Override spring.datasource.password via environment variable:
#   SPRING_DATASOURCE_PASSWORD=yourpassword
# ============================================================

# Server
server.port=8080

# ── Session (security) ───────────────────────────────────────
# Sessions are server-side; the browser only holds an opaque,
# HttpOnly, SameSite=Lax JSESSIONID cookie.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Set SESSION_COOKIE_SECURE=true when serving over HTTPS.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.name=TASKFLOWSESSION

# ── MySQL Database ──────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/task_management_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
# Set SPRING_DATASOURCE_PASSWORD env var in production. Empty = XAMPP default (dev only).
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ─────────────────────────────────────────
# NOTE: Use 'validate' in production with Flyway migrations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# show-sql is OFF in default profile — only enabled in dev profile
spring.jpa.show-sql=false
# Disable Open Session in View (prevents lazy-loading in controller layer)
spring.jpa.open-in-view=false

# ── Scheduler Configuration ─────────────────────────────────
# Minutes before PENDING → IN_PROGRESS auto-transition
task.scheduler.delay-minutes=2
# Additional minutes before IN_PROGRESS → COMPLETED auto-transition
task.scheduler.completion-delay-minutes=5

# ── Swagger / OpenAPI ────────────────────────────────────────
# Swagger UI: http://localhost:8080/swagger-ui.html
# API Docs:   http://localhost:8080/v3/api-docs
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ── Logging ─────────────────────────────────────────────────
# Set to INFO in production for clean logs
logging.level.com.taskmanagement=INFO
logging.level.org.springframework.scheduling=WARN

# ── Security ────────────────────────────────────────────────
# Bootstrap account. Also adopts any pre-existing tasks that have no owner,
# so no historical data is lost when multi-user ownership is introduced.
# OVERRIDE IN PRODUCTION via APP_SEED_PASSWORD / taskflow.seed.password
taskflow.seed.enabled=true
taskflow.seed.email=demo@taskflow.app
taskflow.seed.password=${APP_SEED_PASSWORD:Taskflow#Demo1}
taskflow.seed.name=Demo User

# Login / registration rate limiting
taskflow.security.login.max-attempts=5
taskflow.security.login.window-minutes=15
taskflow.security.login.lockout-minutes=15
taskflow.security.register.max-per-ip-hour=10

