version: "3.9"

# ─────────────────────────────────────────────────────────────
# TaskFlow Pro SaaS Platform — Docker Compose Stack
# Usage: docker compose up --build -d
# ─────────────────────────────────────────────────────────────

services:

  # ── MySQL 8.0 Database ──────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: taskflow-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE:      ${DB_NAME:-taskflow_db}
      MYSQL_USER:          ${DB_USER:-taskflow}
      MYSQL_PASSWORD:      ${DB_PASSWORD:-taskflow123}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"          # 3307 on host to avoid clashing with local MySQL instances
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USER:-taskflow}", "-p${DB_PASSWORD:-taskflow123}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

  # ── TaskFlow Unified SaaS Application (API + React UI) ─────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskflow-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Database Connection
      DB_HOST:     db
      DB_PORT:     3306
      DB_NAME:     ${DB_NAME:-taskflow_db}
      DB_USER:     ${DB_USER:-taskflow}
      DB_PASSWORD: ${DB_PASSWORD:-taskflow123}
      # Security & JWT
      JWT_SECRET:  ${JWT_SECRET:-production-super-secure-jwt-secret-key-at-least-64-characters-long-taskflow-pro}
      # AI Gemini API (optional)
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Mailtrap SMTP
      MAIL_HOST:     ${MAIL_HOST:-sandbox.smtp.mailtrap.io}
      MAIL_PORT:     ${MAIL_PORT:-2525}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      # Server & CORS
      PORT: 8081
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081,http://localhost:5173,http://localhost:3000}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ── Prometheus Observability & Metrics ──────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: taskflow-prometheus
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'

volumes:
  db_data:
    driver: local
  prometheus_data:
    driver: local
