name: CI — Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:

  # ── Backend: Build + Test ─────────────────────────────────────────────
  backend:
    name: Backend (Java 17 / Maven)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run backend tests
        working-directory: taskflow-api
        run: mvn test -B -Dspring.profiles.active=test
        env:
          JWT_SECRET: ci-test-secret-key-at-least-64-chars-long-for-hmac-sha256-signing

      - name: Build backend JAR (skip tests — already ran)
        working-directory: taskflow-api
        run: mvn package -DskipTests -B -q

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: taskflow-api/target/surefire-reports/

  # ── Frontend: Build ───────────────────────────────────────────────────
  frontend:
    name: Frontend (Node 20 / Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: task-management-ui/package-lock.json

      - name: Install dependencies
        working-directory: task-management-ui
        run: npm ci

      - name: Build production bundle
        working-directory: task-management-ui
        run: npm run build
        env:
          VITE_API_URL: https://placeholder.onrender.com

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: task-management-ui/dist/

  # ── Docker: Build images ──────────────────────────────────────────────
  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [ backend, frontend ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        run: docker build -t taskflow-backend:ci ./taskflow-api

      - name: Build frontend Docker image
        run: |
          docker build \
            --build-arg VITE_API_URL=https://placeholder.onrender.com \
            -t taskflow-frontend:ci ./task-management-ui
