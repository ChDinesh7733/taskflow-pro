# ============================================================
# application-render.yml — active on Render cloud deployment
# ============================================================
spring:
  datasource:
    driver-class-name: org.h2.Driver
    # Embedded H2 file database persisted in /tmp/taskflow_db
    url: ${DB_URL:jdbc:h2:file:/tmp/taskflow_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=USER}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false

  flyway:
    enabled: ${FLYWAY_ENABLED:false}

server:
  port: ${PORT:8081}

logging:
  level:
    root: INFO
    com.taskflow: DEBUG
