# ============================================================
# application-render.yml — active on Render cloud deployment
# ============================================================
spring:
  datasource:
    driver-class-name: org.h2.Driver
    # If DB_URL is supplied (e.g. cloud MySQL from Aiven/TiDB), use it;
    # otherwise fallback to embedded H2 file database in /tmp
    url: ${DB_URL:jdbc:h2:file:/tmp/taskflow_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false

  flyway:
    enabled: ${FLYWAY_ENABLED:false}

server:
  port: ${PORT:8081}

logging:
  level:
    root: WARN
    com.taskflow: INFO
