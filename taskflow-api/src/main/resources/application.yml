spring:
  application:
    name: taskflow-api

  datasource:
    # Local default — overridden by DB_URL in prod profile
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:taskflow_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: none              # Flyway owns the schema
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        default_batch_fetch_size: 20

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8081}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

jwt:
  secret: ${JWT_SECRET:change-me-in-production-use-at-least-64-chars-secret-key-here!!}
  access-token-expiry-ms: 900000
  refresh-token-expiry-ms: 604800000

ai:
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: gemini-2.0-flash
    timeout-seconds: 30
  rate-limit:
    requests-per-hour: 10

app:
  mail:
    from: ${MAIL_FROM:noreply@taskflow.dev}
    digest-enabled: true

logging:
  level:
    root: INFO
    com.taskflow: DEBUG
    org.flywaydb: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    mail:
      enabled: false
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

# CORS — comma-separated list; set CORS_ALLOWED_ORIGINS on Render
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175}

# Keep-alive ping — set SELF_URL on Render to your Render URL
self:
  url: ${SELF_URL:}
